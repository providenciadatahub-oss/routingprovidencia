<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mapa Turístico Providencia - Rutas OSRM</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.29/"></script>
  <style>
    html, body, #viewDiv { padding: 0; margin: 0; height: 100%; width: 100%; }
    .instruction-box { 
      position: absolute; top: 15px; left: 15px; background: white; padding: 15px; 
      border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 10; width: 250px; 
    }
  </style>
</head>
<body>
  <div class="instruction-box">
    <h4>Rutas en Providencia</h4>
    <p>Haz clic en el mapa para establecer el destino desde un punto de origen fijo.</p>
  </div>
  <div id="viewDiv"></div>

  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/Graphic",
      "esri/layers/GraphicsLayer"
    ], function(Map, MapView, Graphic, GraphicsLayer) {

      const map = new Map({ basemap: "streets-navigation-vector" });
      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: [-70.61, -33.42], 
        zoom: 14
      });

      const routeLayer = new GraphicsLayer();
      map.add(routeLayer);

      view.on("click", function(event) {
        // Coordenadas: [Longitud, Latitud]
        const origin = [-70.615, -33.425]; 
        const destination = [event.mapPoint.longitude, event.mapPoint.latitude];
        
        calcularRutaOSRM(origin, destination);
      });

      async function calcularRutaOSRM(start, end) {
        const urlRender = "https://osrm-backend-providencia.onrender.com"; 
        
        // CORRECCIÓN 1: La concatenación de coordenadas OSRM usa comas para lon/lat 
        // y punto y coma para separar puntos. Ejemplo: lon,lat;lon,lat
        const query = `${urlRender}/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson`;

        try {
          const response = await fetch(query);
          const data = await response.json();
          
          // CORRECCIÓN 2: El acceso a la geometría es data.routes[0].geometry
          if (!data.routes || data.routes.length === 0) {
            console.warn("No se encontró ruta.");
            return;
          }
          
          const rutaGeometria = data.routes[0].geometry;

          const graficoRuta = new Graphic({
            geometry: {
              type: "polyline",
              paths: rutaGeometria.coordinates
            },
            symbol: {
              type: "simple-line",
              color: [0, 122, 255, 0.8],
              width: 5
            }
          });

          routeLayer.removeAll(); 
          routeLayer.add(graficoRuta);
        } catch (err) {
          console.error("Error conectando con Render:", err);
        }
      }
    });
  </script>
</body>
</html>

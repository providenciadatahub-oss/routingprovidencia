<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mapa Turístico Providencia - Rutas OSRM</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.29/"></script>
  <style>
    html, body, #viewDiv { padding: 0; margin: 0; height: 100%; width: 100%; }
    .instruction-box { 
      position: absolute; top: 15px; left: 15px; background: white; padding: 15px; 
      border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 10; width: 250px; 
    }
  </style>
</head>
<body>
  <div class="instruction-box">
    <h4>Rutas en Providencia</h4>
    <p>Haz clic en el mapa para establecer el destino desde un punto de origen fijo.</p>
  </div>
  <div id="viewDiv"></div>

  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/Graphic",
      "esri/layers/GraphicsLayer"
    ], function(Map, MapView, Graphic, GraphicsLayer) {

      const map = new Map({ basemap: "streets-navigation-vector" });
      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: [-70.61, -33.42], 
        zoom: 14
      });

      const routeLayer = new GraphicsLayer();
      map.add(routeLayer);

      view.on("click", function(event) {
        // Coordenadas: [Longitud, Latitud]
        const origin = [-70.615, -33.425]; 
        const destination = [event.mapPoint.longitude, event.mapPoint.latitude];
        
        calcularRutaOSRM(origin, destination);
      });

      async function calcularRutaOSRM(start, end) {
    // Asegúrate de que esta sea la URL de tu servicio en Render
    const urlRender = "https://osrm-backend-providencia.onrender.com"; 
    
    // CORRECCIÓN: Extraemos explícitamente longitud  y latitud [2] 
    // para evitar que se envíen valores 'undefined'
    const lon1 = start;
    const lat1 = start[2];
    const lon2 = end;
    const lat2 = end[2];

    const query = `${urlRender}/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`;

    try {
        const response = await fetch(query);
        if (!response.ok) throw new Error("Respuesta de red no OK");
        const data = await response.json();
        
        if (data.routes && data.routes.length > 0) {
            const rutaGeometria = data.routes.geometry;
            // Aquí sigue tu lógica para applyEdits en ArcGIS...
            console.log("Ruta obtenida con éxito");
        }
    } catch (err) {
        console.error("Error conectando con OSRM:", err);
       }
      }
    });
  </script>
</body>
</html>
